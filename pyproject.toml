[project]
name = "mcp-uruguay"
version = "0.1.0"
description = "Servidor MCP con datos públicos de Uruguay y la región: cotizaciones del BCU, IPC de Argentina y Brasil, combustibles de ANCAP, clima de INIA, estaciones de Salto Grande, RUT y cédula."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Manu Martinez" }]
keywords = ["mcp", "uruguay", "datos-abiertos", "open-data", "bcu"]
dependencies = [
    "mcp>=2.3,<3",
    "uydatos @ git+https://github.com/manusabbath-arch/uy-datos-abiertos@v0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcp-uruguay = "mcp_uruguay.servidor:main"

[project.urls]
Repository = "https://github.com/manusabbath-arch/mcp-uruguay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_uruguay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not red'"
markers = ["red: sale a internet contra las fuentes reales; se corre con `pytest -m red`"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
