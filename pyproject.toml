[project]
name = "mcp-uruguay"
version = "0.10.1"
description = "Servidor MCP con datos públicos de Uruguay y la región: cotizaciones del BCU, IPC de Argentina y Brasil, combustibles de ANCAP, clima de INIA, estaciones de Salto Grande, geocodificación con IDE.uy, RUT y cédula."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Manu Martinez" }]
keywords = ["mcp", "mcp-server", "uruguay", "datos-abiertos", "open-data", "bcu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2.3,<3",
    "typing_extensions>=4.7",
    "uydatos>=0.11,<0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcp-uruguay = "mcp_uruguay.servidor:main"

[project.urls]
Repository = "https://github.com/manusabbath-arch/mcp-uruguay"
Changelog = "https://github.com/manusabbath-arch/mcp-uruguay/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_uruguay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not red'"
markers = ["red: sale a internet contra las fuentes reales; se corre con `pytest -m red`"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
