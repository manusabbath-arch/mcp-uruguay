name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Una vez por semana contra las fuentes reales: avisa si alguna cambió de forma.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      simular_falla:
        description: "Hace fallar la corrida a propósito, para probar que el trabajo avisar abre el issue"
        type: boolean
        default: false
      simular_inactividad:
        description: "Simula 40 días sin commits, para probar que el trabajo inactividad abre el issue"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Lint
        run: uvx ruff check scripts src tests && uvx ruff format --check scripts src tests
      - name: Tests sin red
        run: uv run --python ${{ matrix.python }} --with pytest --with pytest-cov --with-editable . pytest -q --cov=mcp_uruguay --cov-fail-under=88

  sin-publicar:
    # En uydatos la 0.17.0 quedó una semana en main sin Release (medido el 2026-11-04). Este
    # trabajo solo avisa: publicar lo decide una persona, con scripts/publicar.sh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: La versión de main ya está en PyPI
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mcp-uruguay/$version/json")
          if [ "$codigo" = 200 ]; then
            echo "mcp-uruguay $version está en PyPI." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$codigo" = 404 ]; then
            echo "::warning title=Versión sin publicar::mcp-uruguay $version está en main y no en PyPI. Publicar con scripts/publicar.sh."
            echo "**mcp-uruguay $version está en main y no en PyPI.** Publicar con \`scripts/publicar.sh --de-verdad\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PyPI respondió $codigo: no se pudo saber si $version está publicada." >> "$GITHUB_STEP_SUMMARY"
          fi

  fuentes-reales:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Falla simulada
        if: inputs.simular_falla
        run: echo "falla pedida con simular_falla" && exit 1
      - name: Tests contra las fuentes reales
        run: uv run --python 3.13 --with pytest --with-editable . pytest -q -m red

  instalado-desde-pypi:
    # Lo que instala un usuario, no el código del repo: cada herramienta contra las fuentes reales.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Prueba de humo del paquete publicado
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with mcp-uruguay python scripts/humo.py

  inactividad:
    # GitHub desactiva los workflows programados de un repo público a los 60 días sin actividad, y
    # lo hace sin que ningún trabajo pueda avisar que dejó de correr. La alarma tiene que sonar antes,
    # mientras el cron todavía está vivo: si el último commit tiene 40 días o más, queda un issue.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIMULAR: ${{ inputs.simular_inactividad && 'si' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Avisar si el repo se acerca a los 60 días sin actividad
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          umbral=40
          if [ -n "$SIMULAR" ]; then dias=45; fi
          echo "último commit hace $dias días (se avisa desde los $umbral)"
          [ "$dias" -ge "$umbral" ] || exit 0
          gh label create inactividad --color FBCA04 --description "El repo se acerca a los 60 días sin actividad" 2>/dev/null || true
          {
            echo "El último commit de este repo tiene $dias días. A los 60 días sin actividad GitHub **desactiva"
            echo "los workflows programados** (la corrida semanal contra las fuentes reales y la prueba del"
            echo "paquete publicado) y no avisa en ninguna parte."
            echo
            echo "Para evitarlo: hacer un commit en \`main\`, o publicar la versión que esté pendiente."
            echo "Si ya se desactivaron: Actions → tests → «Enable workflow»."
          } > cuerpo.md
          abierto=$(gh issue list --label inactividad --state open --json number -q '.[0].number')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file cuerpo.md
          else
            gh issue create --title "El repo se acerca a los 60 días sin actividad: GitHub apagará la corrida semanal" --label inactividad --body-file cuerpo.md
          fi

  avisar:
    # Un rojo que nadie mira no es una alarma: del 26/10 al 09/11/2026 la corrida semanal falló tres
    # lunes seguidos por el bloqueo del Parlamento y nadie se enteró. Si falla, queda un issue.
    # Las caídas ya conocidas no llegan acá: `humo.py` y `test_red.py` las informan sin fallar.
    needs: [fuentes-reales, instalado-desde-pypi]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Abrir o comentar el issue de la corrida semanal
        run: |
          gh label create corrida-semanal --color B60205 --description "La corrida contra las fuentes reales falló" 2>/dev/null || true
          fallaron=$(gh run view "${{ github.run_id }}" --json jobs -q '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          {
            echo "La corrida contra las fuentes reales del $(date -u +%d/%m/%Y) falló."
            echo
            echo "- Trabajos en rojo: ${fallaron:-sin determinar}"
            echo "- Corrida: $CORRIDA"
            echo
            echo "Mirar el registro: las líneas \`ERROR\` de \`humo.py\` dicen qué herramienta y con qué motivo."
            echo "Si es una fuente caída y no el paquete, abrir su issue y sumarla a \`CAIDAS_CONOCIDAS\`"
            echo "(\`scripts/humo.py\`) y a \`CAIDAS\` (\`src/mcp_uruguay/guias.py\`)."
          } > cuerpo.md
          abierto=$(gh issue list --label corrida-semanal --state open --json number -q '.[0].number')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file cuerpo.md
          else
            gh issue create --title "La corrida semanal contra las fuentes reales falló" --label corrida-semanal --body-file cuerpo.md
          fi
