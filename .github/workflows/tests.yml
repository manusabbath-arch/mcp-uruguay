name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Una vez por semana contra las fuentes reales: avisa si alguna cambió de forma.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint
        run: uvx ruff check scripts src tests && uvx ruff format --check scripts src tests
      - name: Tests sin red
        run: uv run --python ${{ matrix.python }} --with pytest --with pytest-cov --with-editable . pytest -q --cov=mcp_uruguay --cov-fail-under=88

  sin-publicar:
    # En uydatos la 0.17.0 quedó una semana en main sin Release (medido el 2026-11-04). Este
    # trabajo solo avisa: publicar lo decide una persona, con scripts/publicar.sh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: La versión de main ya está en PyPI
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mcp-uruguay/$version/json")
          if [ "$codigo" = 200 ]; then
            echo "mcp-uruguay $version está en PyPI." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$codigo" = 404 ]; then
            echo "::warning title=Versión sin publicar::mcp-uruguay $version está en main y no en PyPI. Publicar con scripts/publicar.sh."
            echo "**mcp-uruguay $version está en main y no en PyPI.** Publicar con \`scripts/publicar.sh --de-verdad\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PyPI respondió $codigo: no se pudo saber si $version está publicada." >> "$GITHUB_STEP_SUMMARY"
          fi

  fuentes-reales:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tests contra las fuentes reales
        run: uv run --python 3.13 --with pytest --with-editable . pytest -q -m red

  instalado-desde-pypi:
    # Lo que instala un usuario, no el código del repo: cada herramienta contra las fuentes reales.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Prueba de humo del paquete publicado
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with mcp-uruguay python scripts/humo.py
